<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置 · 系统配置（高保真）</title>
<style>
  :root{
    --bg:#0e1116; --surface:#131619; --s-low:#181b1f; --s-cont:#1c1f23;
    --s-high:#23262b; --s-highest:#2b2f34;
    --on:#e4e2e6; --on-var:#c2c7cf; --dim:#8b9099; --outline:#3a3f46;
    --primary:#b0c6ff; --primary-strong:#4f8cff; --primary-cont:#274879;
    --success:#3ecf8e; --warning:#e0a33e; --error:#ffb4ab; --info:#cbbfff;
    --r-sm:8px; --r-md:12px; --r-lg:20px; --r-full:999px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--on);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .appbar{height:52px;display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--outline);font-weight:700}
  .appbar .crumb{color:var(--dim);font-weight:600}
  .appbar .sp{flex:1}
  .appbar .seg{font-size:12px;color:var(--dim);border:1px solid var(--outline);border-radius:var(--r-full);padding:4px 12px;font-weight:600}
  .strip{display:flex;align-items:center;gap:18px;padding:10px 18px;background:var(--s-low);border-bottom:1px solid var(--outline);font-size:13px;flex-wrap:wrap}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
  .dot.ok{background:var(--success);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(62,207,142,.45)}70%{box-shadow:0 0 0 6px rgba(62,207,142,0)}100%{box-shadow:0 0 0 0 rgba(62,207,142,0)}}
  .strip .meta{color:var(--on-var)}
  .strip .div{width:1px;height:18px;background:var(--outline)}
  .strip .store{color:var(--on-var);font-variant-numeric:tabular-nums}
  .strip .store b{color:var(--on)}
  .toggle{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--on-var);font-weight:600}
  .switch{width:38px;height:22px;border-radius:var(--r-full);background:var(--s-highest);position:relative;border:1px solid var(--outline)}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--dim)}

  .shell{display:flex;min-height:calc(100vh - 52px - 41px)}
  .nav{width:234px;flex-shrink:0;padding:20px 12px;border-right:1px solid var(--outline);background:var(--surface)}
  .nav .grp{font-size:11px;letter-spacing:.6px;color:var(--dim);font-weight:700;text-transform:uppercase;padding:0 14px 8px}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:var(--r-full);color:var(--on-var);font-weight:600;margin-bottom:2px;cursor:pointer;white-space:nowrap}
  .nav a:hover{background:var(--s-cont)}
  .nav a.active{background:var(--primary-cont);color:#dbe6ff}
  .nav a .ico{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;opacity:.9;flex-shrink:0}
  .i{width:18px;height:18px;display:block;flex-shrink:0}
  .nav a .label{flex:1;overflow:hidden;text-overflow:ellipsis}
  .nav a .badge{flex-shrink:0;font-size:11px;font-weight:700;border-radius:var(--r-full);padding:1px 8px;background:var(--s-highest);color:var(--on-var);white-space:nowrap}
  .nav a .badge.warn{background:rgba(255,180,171,.16);color:var(--error)}

  .content{flex:1;display:flex;flex-direction:column;gap:18px;padding:20px 26px;overflow:auto;max-width:760px}
  .h-page{font-size:1.5rem;font-weight:700;letter-spacing:-.3px;margin:0 0 3px}
  .sub{color:var(--dim);font-size:13px;margin:0}
  .sec-h{font-size:12px;letter-spacing:.6px;color:var(--dim);font-weight:700;text-transform:uppercase;margin:0 0 10px}
  .card{background:var(--s-low);border:1px solid var(--outline);border-radius:var(--r-md);padding:20px}

  .field{margin-bottom:18px}
  .field:last-child{margin-bottom:0}
  .flabel{font-size:12.5px;color:var(--on);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .flabel .tag{font-size:10.5px;font-weight:700;color:var(--dim);border:1px solid var(--outline);border-radius:var(--r-full);padding:1px 8px;text-transform:none;letter-spacing:0}
  .fhint{font-size:11.5px;color:var(--dim);margin-top:7px}
  .row-inline{display:flex;gap:10px;align-items:center}
  .in{flex:1;min-width:0;height:40px;border-radius:var(--r-md);border:1px solid var(--outline);background:var(--bg);color:var(--on);padding:0 14px;font-size:13px;font-family:var(--font);font-variant-numeric:tabular-nums}
  .in:focus{outline:none;border-color:var(--primary-strong)}
  .btn{display:inline-flex;align-items:center;gap:7px;border-radius:var(--r-full);padding:0 18px;height:40px;font-weight:600;font-size:13px;cursor:pointer;border:1px solid var(--outline);background:transparent;color:var(--primary);flex-shrink:0}
  .btn.filled{background:var(--primary-strong);color:#06224d;border-color:transparent}
  .statline{display:flex;gap:18px;margin-top:12px;padding-top:14px;border-top:1px solid var(--outline);font-size:12.5px;color:var(--on-var);font-variant-numeric:tabular-nums}
  .statline b{color:var(--on)}
  .ro{height:40px;display:flex;align-items:center;padding:0 14px;border-radius:var(--r-md);background:var(--s-cont);border:1px dashed var(--outline);color:var(--on);font-variant-numeric:tabular-nums;font-weight:600}

  .ta{width:100%;min-height:128px;border-radius:var(--r-md);border:1px solid var(--outline);background:var(--bg);color:var(--on);padding:12px 14px;font-size:13px;font-family:var(--font);line-height:1.65;resize:vertical}
  .ta:focus{outline:none;border-color:var(--primary-strong)}
  .segt{display:flex;gap:4px;background:var(--bg);border:1px solid var(--outline);border-radius:var(--r-full);padding:3px;width:fit-content}
  .segt .o{padding:6px 20px;border-radius:var(--r-full);font-size:13px;font-weight:600;color:var(--on-var);cursor:pointer}
  .segt .o.on{background:var(--primary-cont);color:#dbe6ff}
  .save{display:flex;justify-content:flex-end;margin-top:16px}

  .stagger>*{opacity:0;transform:translateY(8px);animation:rise .5s ease forwards}
  .stagger>*:nth-child(1){animation-delay:.04s}.stagger>*:nth-child(2){animation-delay:.10s}
  .stagger>*:nth-child(3){animation-delay:.16s}.stagger>*:nth-child(4){animation-delay:.22s}
  @keyframes rise{to{opacity:1;transform:none}}
</style>
</head>
<body>
  <div class="appbar"><span>设置</span><span class="crumb">/ 系统配置</span><span class="sp"></span><span class="seg">深色</span></div>
  <div class="strip">
    <span><span class="dot ok"></span><span class="meta">网关在线</span></span>
    <span class="div"></span><span class="meta">ffmpeg ✓</span>
    <span class="div"></span><span class="meta">数据实时 · 1s</span>
    <span class="div"></span><span class="store">播放 <b>6.4</b> / 20 GB</span>
    <span class="toggle">暂停所有后台 <span class="switch"></span></span>
  </div>

  <div class="shell">
    <nav class="nav">
      <div class="grp">设置</div>
      <a href="overview.html"><span class="ico"><svg class="i" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg></span><span class="label">概览</span></a>
      <a href="cache.html"><span class="ico"><svg class="i" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C7.58 3 4 4.79 4 7s3.58 4 8 4 8-1.79 8-4-3.58-4-8-4zM4 9v3c0 2.21 3.58 4 8 4s8-1.79 8-4V9c0 2.21-3.58 4-8 4s-8-1.79-8-4zm0 5v3c0 2.21 3.58 4 8 4s8-1.79 8-4v-3c0 2.21-3.58 4-8 4s-8-1.79-8-4z"/></svg></span><span class="label">缓存管理</span><span class="badge">128</span></a>
      <a href="tasks.html"><span class="ico"><svg class="i" viewBox="0 0 24 24" fill="currentColor"><path d="M4 10.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm0-6c-.83 0-1.5.67-1.5 1.5S3.17 7.5 4 7.5 5.5 6.83 5.5 6 4.83 4.5 4 4.5zm0 12c-.83 0-1.5.68-1.5 1.5s.68 1.5 1.5 1.5 1.5-.68 1.5-1.5-.67-1.5-1.5-1.5zM7 19h14v-2H7v2zm0-6h14v-2H7v2zm0-8v2h14V5H7z"/></svg></span><span class="label">任务 · 历史</span><span class="badge warn">2 失败</span></a>
      <a class="active" href="system.html"><span class="ico"><svg class="i" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></span><span class="label">系统配置</span></a>
    </nav>

    <main class="content stagger">
      <div>
        <h1 class="h-page">系统配置</h1>
        <p class="sub">低频设置：缓存位置、容量上限与 AI 助教。</p>
      </div>

      <div>
        <div class="sec-h">存储与目录</div>
        <div class="card">
          <div class="field">
            <label class="flabel">缓存目录</label>
            <div class="row-inline">
              <input class="in" value="/Volumes/Samsung - Data/youdao-course-cache">
              <span class="btn">更换…</span>
            </div>
            <div class="fhint">所有缓存片段与缩略图都存放于此；更换后已有缓存不会自动迁移。</div>
            <div class="statline"><span>可用空间 <b>412 GB</b></span><span>当前占用 <b>6.9 GB</b></span><span>目录状态 <b style="color:var(--success)">正常</b></span></div>
          </div>
          <div class="field">
            <label class="flabel">播放缓存上限 <span class="tag">网关配置 · 只读</span></label>
            <div class="ro">20 GB</div>
            <div class="fhint">由网关环境变量配置（<code>YD_*_CACHE_BYTES</code>）。是否要在此处做成可调，待你确认。</div>
          </div>
        </div>
      </div>

      <div>
        <div class="sec-h">AI 助教</div>
        <div class="card">
          <div class="field">
            <label class="flabel">系统提示词</label>
            <textarea class="ta">你是一位耐心的考研课程助教。回答时优先结合当前讲次的字幕与笔记上下文，分点讲解，必要时给出可在视频里跳转复习的时间点。</textarea>
            <div class="fhint">作用于所有 AI 助教对话；留空则用内置默认。</div>
          </div>
          <div class="field">
            <label class="flabel">推理强度</label>
            <div class="segt"><span class="o">低</span><span class="o on">中</span><span class="o">高</span></div>
            <div class="fhint">越高越细致，但响应更慢、消耗更多额度。</div>
          </div>
          <div class="save"><span class="btn filled">保存</span></div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
